<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>入社前シミュレーター</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='htmx.min.js') }}"></script>
</head>
<body>
  <header>
    <h1>入社前シミュレーター{% if mode == "cache" %} <small>キャッシュモード</small>{% endif %}</h1>
    <p class="lead">応募する前に、その会社での「入社1日目」を体験する。</p>
  </header>
  <main>
    <form hx-post="/judge" hx-target="#result" hx-indicator="#judging">
      <div class="presets">
        {% for c in companies %}
        <button type="button" class="{{ 'on' if loop.first }}" data-text="{{ c.text }}">{{ c.name }}<small>{{ c.hint }}</small></button>
        {% endfor %}
      </div>
      <label>会社（架空）
        <textarea name="company" rows="4">{{ company }}</textarea>
      </label>
      <label>あなたの希望
        <textarea name="seeker" rows="3">{{ seeker }}</textarea>
      </label>
      <button type="submit">1日目を体験する</button>
      <span id="judging" class="htmx-indicator">判定中…</span>
    </form>
    <section id="result"></section>
  </main>
  <script>
    // 会社のボタンで、会社の欄を差し替え、前の結果を消す
    document.querySelectorAll(".presets button").forEach((b) => {
      b.addEventListener("click", () => {
        document.querySelector("textarea[name=company]").value = b.dataset.text;
        document.querySelectorAll(".presets button").forEach((x) => x.classList.toggle("on", x === b));
        document.getElementById("result").innerHTML = "";
      });
    });
  </script>
</body>
</html>

<div class="scene">
  <h2><span class="step">{{ step }}/{{ total }}</span> {{ scene.time }} {{ scene.title }} <small>Gemini・{{ ms }}ms</small></h2>
  <p>{{ scene.text }}</p>
  <div class="actions">
    <p class="question">{{ scene.question }}</p>
    <form hx-post="/choose" hx-target="closest .actions" hx-swap="outerHTML" hx-indicator="this">
      {% include "_carry.html" %}
      <input type="hidden" name="scene" value="{{ scene_json }}">
      {% for o in scene.options %}
      <button type="submit" name="action" value="{{ o }}">{{ o }}</button>
      {% endfor %}
      <span class="htmx-indicator">判定中…</span>
    </form>
  </div>
</div>

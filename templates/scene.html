{% with at = step %}{% include "_progress.html" %}{% endwith %}
<div class="scene">
  <h2>{{ scene.time }} {{ scene.title }} <small>Gemini・{{ ms }}</small></h2>
  <p>{{ scene.text }}</p>
  <div class="actions">
    <p class="question">{{ scene.question }}</p>
    <form hx-post="/choose" hx-target="#stage" hx-swap="innerHTML show:window:top" hx-disabled-elt="button">
      {% include "_carry.html" %}
      <input type="hidden" name="scene" value="{{ scene_json }}">
      {% for o in scene.options %}
      <button type="submit" name="action" value="{{ o }}">{{ o }}</button>
      {% endfor %}
      <span class="htmx-indicator">判定中…</span>
    </form>
  </div>
</div>
